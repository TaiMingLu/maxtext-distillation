# Model config for official Meta Llama 3.2 3B
# head_dim=128 (standard), 24 query heads, 8 KV heads, tie_word_embeddings=true

base_emb_dim: 3072
base_num_query_heads: 24
base_num_kv_heads: 8
base_num_decoder_layers: 28
base_mlp_dim: 8192
head_dim: 128
mlp_activations: ["silu","linear"]
vocab_size: 128256
enable_dropout: False
logits_via_embedding: True
normalization_layer_epsilon: 1.0e-5
rope_max_timescale: 500_000
rope_type: "llama3.1"
decoder_block: "llama2"
